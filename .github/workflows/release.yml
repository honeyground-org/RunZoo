# Publishes ready-to-run builds so nobody needs a toolchain to use RunZoo.
# Tag a commit (git tag v0.2.0 && git push --tags) and the downloads land on
# the release page a few minutes later.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Build universal .app
        run: ./tools/bundle.sh --universal
      - name: Check the binary really is universal
        run: |
          lipo -archs dist/RunZoo.app/Contents/MacOS/RunZoo
          lipo -archs dist/RunZoo.app/Contents/MacOS/RunZoo | grep -q arm64
          lipo -archs dist/RunZoo.app/Contents/MacOS/RunZoo | grep -q x86_64
      - name: Zip
        run: ditto -c -k --keepParent dist/RunZoo.app RunZoo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: RunZoo.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release
      - run: ./target/release/runzoo.exe --dump-tint
      - name: Zip
        run: Compress-Archive -Path target/release/runzoo.exe -DestinationPath RunZoo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: RunZoo-windows-x64.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<'MD'
          ## Download

          | | |
          |---|---|
          | **macOS** | [RunZoo.zip](https://github.com/honeyground-org/RunZoo/releases/latest/download/RunZoo.zip) — Apple silicon and Intel |
          | **Windows** | [RunZoo-windows-x64.zip](https://github.com/honeyground-org/RunZoo/releases/latest/download/RunZoo-windows-x64.zip) — 64-bit |

          (Or from the Assets list at the bottom of this page, which is pinned
          to this version rather than the newest one.)

          ## Install

          **macOS** — unzip, drag **RunZoo.app** to Applications. First launch
          only: the build is ad-hoc signed rather than notarised, so macOS
          quarantines the download.

          ```sh
          xattr -dr com.apple.quarantine /Applications/RunZoo.app
          open /Applications/RunZoo.app
          ```

          Universal: Apple silicon and Intel.

          **Windows** — unzip, run `runzoo.exe`. The animal appears in the
          notification area; right-click it for the dashboard. It is unsigned,
          so SmartScreen will ask once (More info → Run anyway).

          No Rust, no toolchain, nothing else to install. Prefer to build it
          yourself? On a Mac, `./tools/install.sh` does the whole thing,
          including installing Rust if you do not have it.
          MD
          )
          gh release create "${GITHUB_REF_NAME}" RunZoo.zip RunZoo-windows-x64.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "RunZoo ${GITHUB_REF_NAME}" \
            --notes "$NOTES" \
            || gh release upload "${GITHUB_REF_NAME}" RunZoo.zip RunZoo-windows-x64.zip \
               --repo "${GITHUB_REPOSITORY}" --clobber
